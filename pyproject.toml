# Monorepo tooling configuration. Each component has its own requirements.txt,
# because Beam, Spark, dbt and Airflow have mutually incompatible dependency trees.
[project]
name = "gcp-mobility-data-platform"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt/dbt_packages", "dbt/target"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = [
    "PLR0913",
    "PLR2004",
    "PLR0912",  # contract validation is a sequence of ifs, on purpose
    "PLC0415",  # imports inside tasks keep DAG parsing light
]

[tool.ruff.lint.isort]
known-first-party = ["mobility_beam", "mobility_spark", "ride_simulator"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
# Beam's TestPipeline and TestStream start with "Test" and confuse pytest collection
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
markers = [
    "integration: needs real GCP or an emulator (outside the default CI)",
]
