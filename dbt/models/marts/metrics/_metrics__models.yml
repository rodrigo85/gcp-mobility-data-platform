models:
  - name: agg_zone_hourly_demand
    description: Demand per zone and hour, indexed against the same hour-of-week average.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [pickup_hour, pickup_zone_id]
    columns:
      - name: trips
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

  - name: agg_daily_kpis
    description: Daily KPIs from history (TLC) and real time (simulator), side by side.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [kpi_date, source]

  - name: agg_daily_trip_metrics
    description: >
      Daily fleet KPIs: volume, revenue, unit economics, speed, payment mix,
      airport and congestion-toll exposure, 7-day averages and week-over-week change.
    columns:
      - name: pickup_date
        data_tests: [unique, not_null]
      - name: cbd_toll_period
        data_tests:
          - accepted_values:
              arguments:
                values: [before_toll, after_toll]
      - name: card_share
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: airport_share
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: cbd_tolled_share
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: flex_fare_share
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: suspicious_share
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: agg_hour_of_week_profile
    description: Typical week, 7 days x 24 hours, with volumes averaged per calendar day.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [day_of_week, hour_of_day]
    columns:
      - name: hour_of_day
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 23
      - name: share_of_week_trips
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: agg_borough_od_flows
    description: Origin-destination matrix between boroughs with volume, value and speed per flow.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [pickup_borough, dropoff_borough]
    columns:
      - name: share_of_trips
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: share_of_origin_trips
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: agg_airport_trips
    description: Trips to and from EWR, JFK and LGA, with their share of all trips and revenue.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [airport, direction]
    columns:
      - name: airport
        data_tests:
          - accepted_values:
              arguments:
                values: [EWR, JFK, LGA]
      - name: share_of_all_trips
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: agg_payment_mix
    description: Payment type mix, tipping and disputes by borough and month.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [pickup_month, pickup_borough, payment_type]
    columns:
      - name: share_of_borough_trips
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: agg_zone_scorecard
    description: Pickup zone scorecard with ranks and a revenue Pareto curve.
    columns:
      - name: pickup_zone_id
        data_tests: [unique, not_null]
      - name: revenue_tier
        data_tests:
          - accepted_values:
              arguments:
                values: [top_10, core_80pct, long_tail]
      - name: cumulative_revenue_share
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1.000001
  - name: agg_congestion_toll_weekly
    description: Weekly congestion toll tracker by pickup borough, with Manhattan weekday-peak speed.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [week_start, pickup_borough]
    columns:
      - name: tolled_share
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: agg_monthly_summary
    description: Monthly executive summary with month-over-month growth on per-day averages.
    columns:
      - name: pickup_month
        data_tests: [unique, not_null]

exposures:
  - name: mobility_kpis_dashboard
    type: dashboard
    maturity: medium
    url: https://github.com/rodrigo85/gcp-mobility-data-platform/blob/main/dashboard/index.html
    description: >
      Static HTML dashboard (dashboard/index.html, rebuilt from these marts with
      `make dashboard`): monthly and daily KPIs, demand heatmap, borough flows,
      airports, payment mix, zone ranking, congestion toll and real-time rides.
    owner:
      name: Rodrigo Andreatta
    depends_on:
      - ref('agg_daily_kpis')
      - ref('agg_zone_hourly_demand')
      - ref('agg_daily_trip_metrics')
      - ref('agg_monthly_summary')
      - ref('agg_hour_of_week_profile')
      - ref('agg_borough_od_flows')
      - ref('agg_airport_trips')
      - ref('agg_payment_mix')
      - ref('agg_zone_scorecard')
      - ref('agg_congestion_toll_weekly')

unit_tests:
  - name: monthly_summary_normalizes_growth_by_days
    description: >
      Growth compares per-day averages, so a shorter month is not read as a drop.
      January has two days observed, February one; the top zone comes from fct_trips.
    model: agg_monthly_summary
    given:
      - input: ref('agg_daily_trip_metrics')
        rows:
          - {pickup_date: "2025-01-06", trips: 100, revenue: 2000, is_weekend: false}
          - {pickup_date: "2025-01-11", trips: 100, revenue: 2000, is_weekend: true}
          - {pickup_date: "2025-02-03", trips: 150, revenue: 3600, is_weekend: false}
      - input: ref('fct_trips')
        rows:
          - {pickup_date: "2025-01-06", pickup_zone_id: 132, is_suspicious: false}
          - {pickup_date: "2025-01-06", pickup_zone_id: 132, is_suspicious: false}
          - {pickup_date: "2025-01-06", pickup_zone_id: 236, is_suspicious: false}
          - {pickup_date: "2025-02-03", pickup_zone_id: 236, is_suspicious: false}
      - input: ref('dim_zones')
        rows:
          - {zone_id: 132, zone_name: JFK Airport, is_current: true}
          - {zone_id: 236, zone_name: Upper East Side North, is_current: true}
    expect:
      rows:
        - {year_month: "2025-01", days_observed: 2, trips: 200, avg_trips_per_day: 100, avg_ticket: 20, weekend_to_weekday_ratio: 1.0, top_pickup_zone: JFK Airport, trips_per_day_mom_change: null, revenue_per_day_mom_change: null, avg_ticket_mom_change: null}
        - {year_month: "2025-02", days_observed: 1, trips: 150, avg_trips_per_day: 150, avg_ticket: 24, weekend_to_weekday_ratio: null, top_pickup_zone: Upper East Side North, trips_per_day_mom_change: 0.5, revenue_per_day_mom_change: 0.8, avg_ticket_mom_change: 0.2}
