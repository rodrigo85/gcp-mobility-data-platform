models:
  - name: agg_zone_hourly_demand
    description: Demand per zone and hour, indexed against the same hour-of-week average.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [pickup_hour, pickup_zone_id]
    columns:
      - name: trips
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

  - name: agg_daily_kpis
    description: Daily KPIs from history (TLC) and real time (simulator), side by side.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [kpi_date, source]

exposures:
  - name: mobility_kpis_dashboard
    type: dashboard
    maturity: medium
    description: Looker Studio dashboard with demand, revenue and cancellations.
    owner:
      name: Rodrigo Andreatta
    depends_on:
      - ref('agg_daily_kpis')
      - ref('agg_zone_hourly_demand')
