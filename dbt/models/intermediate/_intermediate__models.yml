models:
  - name: int_trips__enriched
    description: Trips with zones, duration, average speed, tip % and a suspicious flag.
    config:
      tags: ["batch"]

  - name: int_rides__lifecycle
    description: One row per streaming ride, with the duration of each phase.
    columns:
      - name: ride_id
        data_tests: [unique, not_null]
      - name: ride_status
        data_tests:
          - accepted_values:
              arguments:
                values: [requested, accepted, in_progress, completed, cancelled]

unit_tests:
  - name: trips_enriched_flags_suspicious_and_computes_tip_pct
    description: Tips only on card; an impossibly fast trip is flagged, not dropped.
    model: int_trips__enriched
    given:
      - input: ref('stg_tlc__yellow_trips')
        rows:
          - trip_id: normal
            pickup_datetime: "2025-01-15 08:00:00"
            dropoff_datetime: "2025-01-15 08:30:00"
            trip_distance_miles: 5.0
            payment_type: credit_card
            fare_amount: 20.00
            tip_amount: 4.00
            total_amount: 28.00
            pickup_zone_id: 132
            dropoff_zone_id: 236
          - trip_id: teleport
            pickup_datetime: "2025-01-15 09:00:00"
            dropoff_datetime: "2025-01-15 09:01:00"
            trip_distance_miles: 30.0
            payment_type: cash
            fare_amount: 70.00
            tip_amount: 0.00
            total_amount: 75.00
            pickup_zone_id: 132
            dropoff_zone_id: 1
      - input: ref('stg_tlc__taxi_zones')
        rows:
          - {zone_id: 1, borough: EWR, zone_name: Newark Airport}
          - {zone_id: 132, borough: Queens, zone_name: JFK Airport}
          - {zone_id: 236, borough: Manhattan, zone_name: Upper East Side North}
    expect:
      rows:
        - {trip_id: normal, trip_duration_minutes: 30.0, tip_pct: 0.2, is_suspicious: false, pickup_borough: Queens, dropoff_borough: Manhattan}
        - {trip_id: teleport, trip_duration_minutes: 1.0, tip_pct: null, is_suspicious: true, pickup_borough: Queens, dropoff_borough: EWR}

  - name: rides_lifecycle_derives_status_and_timings
    model: int_rides__lifecycle
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_rides__events')
        rows:
          - {event_id: e1, ride_id: r1, event_type: requested, event_ts: "2026-01-01 12:00:00", ingest_ts: "2026-01-01 12:05:00"}
          - {event_id: e2, ride_id: r1, event_type: accepted, event_ts: "2026-01-01 12:01:30", ingest_ts: "2026-01-01 12:05:00"}
          - {event_id: e3, ride_id: r2, event_type: requested, event_ts: "2026-01-01 12:00:00", ingest_ts: "2026-01-01 12:05:00"}
          - {event_id: e4, ride_id: r2, event_type: cancelled, event_ts: "2026-01-01 12:02:00", ingest_ts: "2026-01-01 12:05:00"}
          - {event_id: e5, ride_id: r3, event_type: completed, event_ts: "2026-01-01 12:30:00", fare_amount: 15.5, ingest_ts: "2026-01-01 12:35:00"}
    expect:
      rows:
        - {ride_id: r1, ride_status: accepted, seconds_to_accept: 90, fare_amount: null, has_missing_events: false}
        - {ride_id: r2, ride_status: cancelled, seconds_to_accept: null, fare_amount: null, has_missing_events: false}
        - {ride_id: r3, ride_status: completed, seconds_to_accept: null, fare_amount: 15.5, has_missing_events: true}
