models:
  - name: stg_rides__events
    description: One event per event_id.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values: [requested, accepted, started, completed, cancelled]

  - name: stg_rides__zone_demand
    description: Demand per zone and minute, with late-data corrections applied.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [pickup_zone_id, window_start]
