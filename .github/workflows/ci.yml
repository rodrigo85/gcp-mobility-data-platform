name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11" # same version as Airflow and Spark in production

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==0.17.0
      - run: ruff check .
      - run: ruff format --check .

  test-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: simulator/requirements.txt
      - run: pip install -r simulator/requirements.txt
      - run: pytest simulator/tests
        env:
          PYTHONPATH: simulator

  test-beam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pipelines/beam/requirements.txt
      - run: pip install -r pipelines/beam/requirements.txt -e pipelines/beam
      - run: pytest pipelines/beam/tests

  test-spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pipelines/spark/requirements.txt
      - run: pip install -r pipelines/spark/requirements.txt
      - run: pytest pipelines/spark/tests
        env:
          PYTHONPATH: pipelines/spark

  test-airflow:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_VERSION: "2.10.4"
      AIRFLOW_HOME: /tmp/airflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Airflow with official constraints
        run: |
          CONSTRAINTS="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install "apache-airflow==${AIRFLOW_VERSION}" \
            apache-airflow-providers-apache-spark apache-airflow-providers-google \
            pytest --constraint "$CONSTRAINTS"
      - run: airflow db migrate
      - run: pytest orchestration/airflow/tests

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  dbt-parse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt
    env:
      GCP_PROJECT_ID: ci-parse-only
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: dbt/requirements.txt
      - run: pip install -r requirements.txt
      - run: dbt deps
      # parse does not connect to BigQuery: it validates Jinja, refs, YAML, contracts and unit tests
      - run: dbt parse --warn-error
